  <text x="28" y="330" xml:space="preserve"><tspan fill="#ede8dc">  </tspan><tspan fill="#7fd3a0">[+] available</tspan><tspan fill="#ede8dc">  PyPI                        high    </tspan><tspan fill="#9c9687">pypi.org/project/ramsharma/</tspan></text>
